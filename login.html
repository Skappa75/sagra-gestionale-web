<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagra Strozzapreti — Accesso</title>
<link rel="stylesheet" href="stile-comune.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f4a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sagra Gestionale">
<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .topbar-login {
    justify-content: center;
  }
  main.contenitore-login {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    background: white;
    border-radius: 12px;
    padding: 32px 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 16px rgba(74, 44, 29, 0.12);
    border: 1px solid var(--colore-riquadro);
  }
  h1.titolo-box {
    font-size: 1.3rem;
    text-align: center;
    margin: 0 0 20px;
    color: var(--colore-verde-scuro);
  }
  /* Unica scritta della schermata iniziale: piu' grande del titolo standard
     e nel verde della sagra, cosi' si legge a colpo d'occhio anche con il
     telefono in mano e poca luce. */
  h1.titolo-ruolo {
    font-size: 1.9rem;
    font-weight: bold;
    color: var(--colore-verde-scuro);
    margin: 4px 0 24px;
  }
  .sottotitolo {
    text-align: center;
    color: var(--colore-grigio);
    font-size: 0.9rem;
    margin: -10px 0 20px;
  }
  button.ruolo {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border: 2px solid var(--colore-verde-scuro);
    border-radius: 8px;
    background: white;
    color: var(--colore-verde-scuro);
    font-size: 1.1rem;
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.ruolo:active, button.ruolo:hover { background: var(--colore-riquadro); }
  button.istanza {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--colore-grigio);
    border-radius: 8px;
    background: var(--colore-riquadro);
    color: var(--colore-marrone);
    font-size: 1rem;
    font-family: Arial, sans-serif;
    cursor: pointer;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 14px;
    font-size: 1.3rem;
    text-align: center;
    border-radius: 8px;
    border: 2px solid var(--colore-grigio);
    background: white;
    color: var(--colore-marrone);
    margin-bottom: 16px;
    letter-spacing: 2px;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }
  button.conferma {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--colore-giallo);
    color: var(--colore-marrone);
    font-size: 1.1rem;
    font-weight: bold;
    font-family: Arial, sans-serif;
    cursor: pointer;
  }
  .separatore-report {
    border-top: 1px solid var(--colore-riquadro);
    margin-top: 14px;
    padding-top: 14px;
  }
  button.btn-report {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: 2px solid var(--colore-verde-scuro);
    border-radius: 8px;
    background: white;
    color: var(--colore-verde-scuro);
    font-size: 1rem;
    font-family: Arial, sans-serif;
    cursor: pointer;
  }
  .separatore-report button.btn-report:last-child { margin-bottom: 0; }
  button.btn-report:active, button.btn-report:hover { background: var(--colore-riquadro); }
  button.indietro {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    background: transparent;
    color: var(--colore-grigio);
    font-size: 0.95rem;
    font-family: Arial, sans-serif;
    cursor: pointer;
  }
  .errore {
    color: #a02020;
    text-align: center;
    margin-bottom: 12px;
    font-size: 0.9rem;
    min-height: 1.2em;
  }
  .caricamento { text-align: center; color: var(--colore-grigio); }

  /* ---- Accesso camerieri: stessa disposizione a file del Supporto
     Camerieri (otto colonne affiancate su due righe), cosi' il cameriere
     cerca il proprio nome dove e' abituato a vederlo sul foglio di sala.
     Restano solo fila e nomi: nessun altro dato. ---- */
  .box:has(.griglia-file-accesso) { max-width: 760px; }

  .griglia-file-accesso {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }

  .fila-accesso {
    border: 1px solid var(--colore-riquadro);
    border-radius: 8px;
    overflow: hidden;
  }

  .fila-accesso-testa {
    background: var(--colore-verde-scuro);
    color: white;
    padding: 5px 8px;
    font-weight: 700;
    font-size: 0.8rem;
    text-align: center;
  }

  .fila-accesso-nomi {
    display: flex;
    flex-direction: column;
    min-height: 34px;
  }

  .nome-cameriere-accesso {
    display: block;
    width: 100%;
    padding: 9px 6px;
    border: none;
    border-bottom: 1px solid var(--colore-riquadro);
    background: white;
    font-family: Arial, sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    text-align: center;
    /* Non ancora accreditato: grigio chiaro, presente ma in secondo piano */
    color: #b0aca6;
  }
  .nome-cameriere-accesso:last-child { border-bottom: none; }

  /* Gia' entrato in servizio: nome in nero, ben leggibile */
  .nome-cameriere-accesso.accreditato {
    color: #1a1a1a;
    font-weight: 700;
  }

  .nome-cameriere-accesso:active { background: var(--colore-riquadro); }

  /* Su schermi stretti le otto file restano su due righe, riducendo il
     testo invece di impilare le colonne: e' la disposizione che rende
     riconoscibile il foglio di sala. */
  @media (max-width: 560px) {
    .griglia-file-accesso { gap: 5px; }
    .fila-accesso-testa { font-size: 0.7rem; padding: 4px 2px; }
    .nome-cameriere-accesso { font-size: 0.85rem; padding: 8px 2px; }
  }
</style>
</head>
<body>

<header class="topbar topbar-login">
  <div class="marchio">
    <img src="img/logo-proloco.png" alt="Logo Pro Loco" class="logo-piccolo">
    <span class="nome-sagra">Sagra degli Strozzapreti</span>
  </div>
</header>

<main class="contenitore-login">
  <div class="box" id="box">
    <h1 class="titolo-box">Accesso</h1>
    <div class="caricamento" id="caricamento">Un attimo...</div>
  </div>
</main>

<script src="base-api.js"></script>
<script src="marchio-sagra.js"></script>
<script>
const API = '/api/auth';
const CHIAVE_STORAGE = 'sagra_identita';

// Il pulsante "Link WhatsApp" viveva qui, nel sottomenu delle Casse: e'
// stato spostato nel pannello Admin Serate (28/7/2026), che e' il posto
// dove si configurano dominio, indirizzo dell'app e rete WiFi — cioe' tutto
// cio' che compone quel messaggio.

// Mappa ruolo -> pagina di destinazione
const PAGINE = {
  cassa: 'cassa.html',
  caposala: 'caposala.html',
  supporto_camerieri: 'supporto-camerieri.html',
  cucina: 'cucina.html',
  griglieria: 'griglieria.html',
  cameriere: 'camerieri.html',
};

const box = document.getElementById('box');

function vaiAllaPagina(identita) {
  const pagina = PAGINE[identita.ruolo];
  if (pagina) {
    window.location.href = pagina;
  }
}

function salvaEVai(identita) {
  localStorage.setItem(CHIAVE_STORAGE, JSON.stringify(identita));
  vaiAllaPagina(identita);
}

// --------------------------------------------------
// 1) Al caricamento: se c'è già un'identità salvata, entra direttamente
// --------------------------------------------------
function controllaIdentitaEsistente() {
  const salvata = localStorage.getItem(CHIAVE_STORAGE);
  if (salvata) {
    try {
      const identita = JSON.parse(salvata);
      if (PAGINE[identita.ruolo]) {
        vaiAllaPagina(identita);
        return true;
      }
      // Identità salvata ma con un ruolo non riconosciuto (dati vecchi o
      // incompatibili): la scartiamo invece di restare bloccati in silenzio
      // sulla schermata "Un attimo..." senza mai mostrare i pulsanti dei ruoli.
      localStorage.removeItem(CHIAVE_STORAGE);
    } catch (e) {
      localStorage.removeItem(CHIAVE_STORAGE);
    }
  }
  return false;
}

// --------------------------------------------------
// 2) Schermata scelta ruolo
// --------------------------------------------------
function mostraSceltaRuolo() {
  box.innerHTML = `
    <!-- Il nome della sagra e' gia' nella barra in alto insieme al logo:
         ripeterlo qui rubava spazio senza aggiungere nulla. Resta solo
         l'istruzione, che e' l'unica cosa che serve leggere. -->
    <h1 class="titolo-box titolo-ruolo">Scegli il tuo ruolo</h1>
    <button class="ruolo" data-ruolo="cassa">Casse - Menu - Admin</button>
    <button class="ruolo" data-ruolo="caposala">Caposala</button>
    <button class="ruolo" data-ruolo="supporto_camerieri">Supporto Camerieri</button>
    <button class="ruolo" data-ruolo="cucina">Cucina</button>
    <button class="ruolo" data-ruolo="griglieria">Griglieria</button>
    <button class="ruolo" data-ruolo="cameriere">Cameriere</button>
  `;
  box.querySelectorAll('button.ruolo').forEach(btn => {
    btn.addEventListener('click', () => gestisciSceltaRuolo(btn.dataset.ruolo));
  });
}

async function gestisciSceltaRuolo(ruolo) {
  if (ruolo === 'cameriere') {
    await mostraSelezioneCameriere();
  } else {
    await mostraSelezioneIstanza(ruolo);
  }
}

// --------------------------------------------------
// 3) Selezione istanza (es. Cassa 1 / Cassa 2) + inserimento codice
// --------------------------------------------------
async function mostraSelezioneIstanza(ruolo) {
  box.innerHTML = `<div class="caricamento">Carico...</div>`;
  const risposta = await fetch(`${API}/postazioni`);
  const dati = await risposta.json();
  const richiediCodice = dati.richiediCodice;
  const istanze = dati.postazioni.filter(p => p.ruolo === ruolo);

  if (istanze.length === 1) {
    if (richiediCodice) {
      mostraInserimentoCodice(istanze[0]);
    } else {
      loginDiretto(istanze[0]);
    }
    return;
  }

  box.innerHTML = `
    <h1 class="titolo-box">Scegli postazione</h1>
    <div id="lista-istanze"></div>
    ${ruolo === 'cassa' ? `
      <div class="separatore-report">
        <button class="btn-report" id="btn-menu">🍽️ Gestione Menu</button>
        <button class="btn-report" id="btn-report">📊 Report</button>
        <button class="btn-report" id="btn-admin">⚙️ Admin Serate</button>
      </div>
    ` : ''}
    <button class="indietro" id="btn-indietro">← Indietro</button>
  `;
  const lista = document.getElementById('lista-istanze');
  istanze.forEach(ist => {
    const btn = document.createElement('button');
    btn.className = 'istanza';
    btn.textContent = ist.nome_istanza;
    btn.addEventListener('click', () => {
      if (richiediCodice) {
        mostraInserimentoCodice(ist);
      } else {
        loginDiretto(ist);
      }
    });
    lista.appendChild(btn);
  });
  // Scorciatoie a Gestione Menu, Report & Bilanci e al Pannello Admin: non
  // fanno login, aprono semplicemente le rispettive pagine (Report e Admin
  // gestiscono da sole la propria schermata di sblocco con la password
  // amministratore; Gestione Menu si sblocca da sola se sei già loggato
  // come Cassa in questo browser, altrimenti chiede la password di una
  // Cassa o dell'Admin — 22/7/2026, protezione aggiunta perché prima
  // chiunque conoscesse l'URL poteva modificare prezzi/voci).
  if (ruolo === 'cassa') {
    document.getElementById('btn-menu').addEventListener('click', () => {
      window.location.href = 'menu.html';
    });
    document.getElementById('btn-report').addEventListener('click', () => {
      window.location.href = 'report.html';
    });
    document.getElementById('btn-admin').addEventListener('click', () => {
      window.location.href = 'admin.html';
    });
  }
  document.getElementById('btn-indietro').addEventListener('click', mostraSceltaRuolo);
}

// Login diretto senza PIN (modalità test — RICHIEDI_CODICE = false lato server)
async function loginDiretto(postazione) {
  const risposta = await fetch(`${API}/login-postazione`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ postazione_id: postazione.id }),
  });

  if (!risposta.ok) {
    alert('Errore di accesso, riprova.');
    return;
  }

  const identita = await risposta.json();
  salvaEVai(identita);
}

function mostraInserimentoCodice(postazione) {
  box.innerHTML = `
    <h1 class="titolo-box">${postazione.nome_istanza}</h1>
    <div class="errore" id="errore"></div>
    <input type="password" id="input-codice" inputmode="numeric" placeholder="Codice" autofocus>
    <button class="conferma" id="btn-conferma">Entra</button>
    <button class="indietro" id="btn-indietro">← Indietro</button>
  `;

  const inputCodice = document.getElementById('input-codice');
  const errore = document.getElementById('errore');

  async function conferma() {
    const codice = inputCodice.value.trim();
    if (!codice) return;

    const risposta = await fetch(`${API}/login-postazione`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ postazione_id: postazione.id, codice }),
    });

    if (!risposta.ok) {
      const dati = await risposta.json();
      errore.textContent = dati.errore || 'Errore di accesso.';
      inputCodice.value = '';
      inputCodice.focus();
      return;
    }

    const identita = await risposta.json();
    salvaEVai(identita);
  }

  document.getElementById('btn-conferma').addEventListener('click', conferma);
  inputCodice.addEventListener('keydown', (e) => { if (e.key === 'Enter') conferma(); });
  document.getElementById('btn-indietro').addEventListener('click', mostraSceltaRuolo);
}

// --------------------------------------------------
// 4) Selezione nome cameriere (nessun codice)
// I camerieri sono registrati per singola serata, quindi prima
// serve sapere qual è la serata attiva.
// --------------------------------------------------
async function mostraSelezioneCameriere() {
  box.innerHTML = `<div class="caricamento">Carico elenco camerieri...</div>`;

  const serata = await fetch('/api/serata-attiva').then(r => r.json()).catch(() => null);

  if (!serata) {
    box.innerHTML = `
      <h1 class="titolo-box">Chi sei?</h1>
      <p style="text-align:center;color:#a02020;">Nessuna serata aperta al momento.<br>Chiedi alla Cassa di aprire la serata.</p>
      <button class="indietro" id="btn-indietro">← Indietro</button>
    `;
    document.getElementById('btn-indietro').addEventListener('click', mostraSceltaRuolo);
    return;
  }

  const risposta = await fetch(`${API}/camerieri?serata_id=${serata.id}`);
  const camerieri = await risposta.json();

  box.innerHTML = `
    <h1 class="titolo-box">Chi sei?</h1>
    <div class="sottotitolo">Tocca il tuo nome nella tua fila</div>
    <div class="griglia-file-accesso" id="griglia-file-accesso"></div>
    <button class="indietro" id="btn-indietro">← Indietro</button>
  `;

  const griglia = document.getElementById('griglia-file-accesso');

  if (camerieri.length === 0) {
    griglia.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--colore-grigio);">Nessun cameriere registrato ancora per questa serata.<br>Chiedi al Supporto Camerieri di registrarti.</p>`;
  } else {
    // Stessa disposizione della griglia del Supporto Camerieri: le otto file
    // affiancate in colonne, il nome della fila in testa e sotto i camerieri
    // che le sono stati assegnati. Chi non si e' ancora presentato resta in
    // grigio chiaro, chi e' gia' entrato in servizio compare in nero: cosi'
    // il cameriere trova subito il proprio nome dove si aspetta di trovarlo,
    // e si vede a colpo d'occhio chi manca ancora all'appello.
    const ORDINE_FILE_ACCESSO = [1, 2, 3, 4, 5, 6, 7, 8];

    griglia.innerHTML = ORDINE_FILE_ACCESSO.map(fila => {
      const diQuestaFila = camerieri.filter(c => c.fila_assegnata === fila);
      const nomi = diQuestaFila.map(c => `
        <button class="nome-cameriere-accesso ${c.accreditato_il ? 'accreditato' : ''}"
                data-cameriere="${c.id}">${escapeTesto(c.nome)}</button>
      `).join('');
      return `
        <div class="fila-accesso">
          <div class="fila-accesso-testa">Fila ${fila}</div>
          <div class="fila-accesso-nomi">${nomi}</div>
        </div>
      `;
    }).join('');

    // Nessun blocco per i camerieri senza fila: il Supporto Camerieri
    // assegna sempre tutti a una fila, quindi il caso non si presenta.

    griglia.querySelectorAll('[data-cameriere]').forEach(btn => {
      btn.addEventListener('click', () => confermaCameriere(Number(btn.dataset.cameriere)));
    });
  }

  document.getElementById('btn-indietro').addEventListener('click', mostraSceltaRuolo);
}

// I nomi arrivano dal database e sono scritti a mano dal Supporto Camerieri:
// vanno inseriti come testo, non come HTML.
function escapeTesto(testo) {
  const div = document.createElement('div');
  div.textContent = testo == null ? '' : String(testo);
  return div.innerHTML;
}

// Identificativo di QUESTO telefono, generato una volta sola e conservato:
// serve al server per garantire che un cameriere sia in servizio su un solo
// dispositivo alla volta (una comanda la serve una persona sola).
function idDispositivo() {
  let id = localStorage.getItem('sagra_device_id');
  if (!id) {
    id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('sagra_device_id', id);
  }
  return id;
}

async function confermaCameriere(cameriere_id, forza) {
  const risposta = await fetch(`${API}/login-cameriere`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cameriere_id, device_id: idDispositivo(), forza: !!forza }),
  });

  const dati = await risposta.json().catch(() => ({}));

  // Nome gia' in servizio su un altro telefono: si chiede conferma invece di
  // bloccare del tutto, perche' il caso vero e' il telefono scarico o rotto a
  // meta' serata. Confermando, il vecchio dispositivo viene disconnesso.
  if (risposta.status === 409 && dati.gia_su_altro_dispositivo) {
    const procedi = confirm(
      `${dati.nome} risulta gia' in servizio su un altro telefono.\n\n` +
      `Ogni cameriere puo' usare un solo dispositivo alla volta.\n\n` +
      `Sei davvero ${dati.nome} e vuoi continuare da questo telefono?\n` +
      `(l'altro dispositivo verra' disconnesso)`
    );
    if (!procedi) return;
    return confermaCameriere(cameriere_id, true);
  }

  if (!risposta.ok) {
    alert(dati.errore || 'Errore, riprova.');
    return;
  }

  salvaEVai(dati);
}

// --------------------------------------------------
// Avvio
// --------------------------------------------------
if (!controllaIdentitaEsistente()) {
  mostraSceltaRuolo();
}
</script>

</body>
</html>
